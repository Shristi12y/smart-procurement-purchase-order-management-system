
<div class="supplier-sidebar">

  <!-- MAIN MENU -->

  <div class="menu-label">
    MAIN MENU
  </div>

  <nav>

    <!-- Dashboard -->

    <a
      routerLink="/supplier/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">

      <mat-icon>
        dashboard
      </mat-icon>

      <span>
        Dashboard
      </span>

    </a>


    <!-- Purchase Orders -->

    <a
      routerLink="/supplier/purchase-orders"
      routerLinkActive="active">

      <mat-icon>
        shopping_cart
      </mat-icon>

      <span>
        Purchase Orders
      </span>

    </a>


    <!-- Products -->

    <a
      routerLink="/supplier/products"
      routerLinkActive="active">

      <mat-icon>
        inventory_2
      </mat-icon>

      <span>
        Products
      </span>

    </a>

  </nav>


  <!-- FINANCE -->

  <div class="menu-label management-label">
    FINANCE
  </div>

  <nav>

    <!-- Payments -->

    <a
      routerLink="/supplier/payments"
      routerLinkActive="active">

      <mat-icon>
        payments
      </mat-icon>

      <span>
        Payments
      </span>

    </a>


    <!-- Payment History -->

    <a
      routerLink="/supplier/payment-history"
      routerLinkActive="active">

      <mat-icon>
        history
      </mat-icon>

      <span>
        Payment History
      </span>

    </a>

  </nav>


  <!-- ACCOUNT -->

  <div class="menu-label management-label">
    ACCOUNT
  </div>

  <nav>

    <!-- Rating -->

    <a
      routerLink="/supplier/rating"
      routerLinkActive="active">

      <mat-icon>
        star
      </mat-icon>

      <span>
        Rating
      </span>

    </a>


    <!-- Profile -->

    <a
      routerLink="/supplier/profile"
      routerLinkActive="active">

      <mat-icon>
        person
      </mat-icon>

      <span>
        My Profile
      </span>

    </a>

  </nav>

</div>
