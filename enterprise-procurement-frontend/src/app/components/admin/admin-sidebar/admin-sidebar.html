<div class="admin-sidebar">

  <!-- MAIN MENU -->

  <div class="menu-label">
    MAIN MENU
  </div>

  <nav>

    <!-- Dashboard -->

    <a
      routerLink="/admin/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">

      <mat-icon>
        dashboard
      </mat-icon>

      <span>
        Dashboard
      </span>

    </a>


    <!-- Purchase Requests -->

    <a
      routerLink="/admin/purchase-requests"
      routerLinkActive="active">

      <mat-icon>
        shopping_cart
      </mat-icon>

      <span>

      </span>

    </a>


    <!-- Products -->

    <a
      routerLink="/admin/products"
      routerLinkActive="active">

      <mat-icon>
        inventory_2

      <span>

      </span>

    </a>

    <!-- Payments -->

    <a
      routerLink="/admin/payments"
      routerLinkActive="active">

      <mat-icon>
        payments
      </mat-icon>

      <span>
        Payments
      </span>

    </a>

  </nav>


  <!-- MANAGEMENT -->

  <div class="menu-label management-label">
    MANAGEMENT
  </div>

  <nav>

    <!-- Suppliers -->

    <a
      routerLink="/admin/suppliers"
      routerLinkActive="active">

      <mat-icon>
        business
      </mat-icon>

      <span>

      </span>

    </a>

    <a
  routerLink="/admin/users"
  routerLinkActive="active">

  <span>
    Users
  </span>

</a>

    <a
      routerLink="/admin/categories"
      routerLinkActive="active">

      <mat-icon>
        category
      </mat-icon>

      <span>
        Categories
      </span>

    </a>

    <a
      routerLink="/admin/departments"
      routerLinkActive="active">

      <mat-icon>
        business_center
      </mat-icon>

      <span>
        Departments
      </span>

    </a>

  </nav>


  <!-- REPORTS -->

  <div class="menu-label management-label">
    REPORTS
  </div>

  <nav>

    <!-- Payment Excel -->

    <a
      href="javascript:void(0)"
      (click)="downloadPaymentExcel()">

      <mat-icon>
        table_view
      </mat-icon>

      <span>
        Payment Excel
      </span>

    </a>


    <!-- Payment PDF -->

    <a
      href="javascript:void(0)"
      (click)="downloadPaymentPdf()">

      <mat-icon>
        picture_as_pdf

      <span>
        Payment PDF

    </a>
