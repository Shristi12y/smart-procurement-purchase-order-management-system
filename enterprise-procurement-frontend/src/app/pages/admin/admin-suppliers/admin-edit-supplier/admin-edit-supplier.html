<div class="supplier-form-page">

  <!-- Header -->
  <div class="page-header">

    <div class="header-left">

      <button
        mat-icon-button
        class="back-btn"
        routerLink="/admin/suppliers">
        <mat-icon>arrow_back</mat-icon>
      </button>

      <div>
        <h1>Edit Supplier</h1>
        <p>Update supplier information</p>
      </div>

    </div>

  </div>


  <!-- Loading -->
  @if (loadingSupplier) {

    <div class="loading-card">

      <mat-icon>hourglass_empty</mat-icon>

      <p>Loading supplier information...</p>

    </div>

  }


  <!-- Form -->
  @if (!loadingSupplier) {

    <div class="form-card">

      <div class="section-title">

        <mat-icon>edit</mat-icon>

        <div>
          <h2>Supplier Information</h2>
          <p>Update the supplier's information below</p>
        </div>

      </div>


      <form (ngSubmit)="updateSupplier()">

        <!-- Basic Information -->
        <div class="form-section">

          <h3>Basic Information</h3>

          <div class="form-grid">

            <!-- Supplier ID -->
            <div class="form-group">

              <label>Supplier ID</label>

              <input
                type="text"
                [value]="supplier.supplierId"
                disabled>

            </div>


            <!-- Name -->
            <div class="form-group">

              <label>
                Supplier Name <span>*</span>
              </label>

              <input
                type="text"
                name="name"
                [(ngModel)]="supplier.name"
                placeholder="Enter supplier name"
                required>

            </div>


            <!-- Phone -->
            <div class="form-group">

              <label>
                Phone Number <span>*</span>
              </label>

              <input
                type="text"
                name="phone"
                [(ngModel)]="supplier.phone"
                maxlength="10"
                placeholder="Enter 10-digit phone number"
                required>

            </div>


            <!-- Email -->
            <div class="form-group">

              <label>
                Email <span>*</span>
              </label>

              <input
                type="email"
                name="email"
                [(ngModel)]="supplier.email"
                placeholder="Enter supplier email"
                required>

            </div>

          </div>


          <!-- Address -->
          <div class="form-group full-width">

            <label>
              Address <span>*</span>
            </label>

            <textarea
              name="address"
              [(ngModel)]="supplier.address"
              placeholder="Enter complete supplier address"
              rows="3"
              required>
            </textarea>

          </div>

        </div>


        <!-- Business Information -->
        <div class="form-section">

          <h3>Business Information</h3>

          <div class="form-grid">

            <!-- Account -->
            <div class="form-group">

              <label>
                Account Number <span>*</span>
              </label>

              <input
                type="text"
                name="accountNo"
                [(ngModel)]="supplier.accountNo"
                placeholder="Enter account number"
                required>

            </div>


            <!-- GST -->
            <div class="form-group">

              <label>
                GST Number <span>*</span>
              </label>

              <input
                type="text"
                name="gstNumber"
                [(ngModel)]="supplier.gstNumber"
                placeholder="Enter GST number"
                required>

            </div>


            <!-- Status -->
            <div class="form-group">

              <label>Status</label>

              <select
                name="status"
                [(ngModel)]="supplier.status">

                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>

              </select>

            </div>


            <!-- Rating -->
            <div class="form-group">

              <label>Rating</label>

              <select
                name="rating"
                [(ngModel)]="supplier.rating">

                <option [ngValue]="null">Not Rated</option>
                <option [ngValue]="1">1 - Poor</option>
                <option [ngValue]="2">2 - Fair</option>
                <option [ngValue]="3">3 - Good</option>
                <option [ngValue]="4">4 - Very Good</option>
                <option [ngValue]="5">5 - Excellent</option>

              </select>

            </div>

          </div>


          <!-- Feedback -->
          <div class="form-group full-width">

            <label>Feedback</label>

            <textarea
              name="feedback"
              [(ngModel)]="supplier.feedback"
              placeholder="Enter supplier feedback"
              rows="3">
            </textarea>

          </div>

        </div>


        <!-- Actions -->
        <div class="form-actions">

          <button
            type="button"
            mat-stroked-button
            class="cancel-btn"
            (click)="cancel()">

            Cancel

          </button>


          <button
            type="submit"
            mat-raised-button
            class="save-btn"
            [disabled]="loading">

            <mat-icon>
              {{ loading ? 'hourglass_empty' : 'save' }}
            </mat-icon>

            {{ loading ? 'Saving...' : 'Save Changes' }}

          </button>

        </div>

      </form>

    </div>

  }

</div>
